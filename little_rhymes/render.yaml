# Paid web/DB/cache resources: review Render's current costs before creating.
databases:
  - name: little-rhymes-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: little_rhymes
    user: little_rhymes
    diskSizeGB: 5
    ipAllowList: []

services:
  - type: keyvalue
    name: little-rhymes-cache
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: little-rhymes
    runtime: python
    rootDir: little_rhymes
    plan: 0.5c-512mb
    region: singapore
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: little-rhymes-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: 'True'
      - key: REDIS_URL
        fromService:
          name: little-rhymes-cache
          type: keyvalue
          property: connectionString
      - key: USE_S3
        value: 'True'
      - key: TRUST_RENDER_PROXY
        value: 'True'
      - key: WEB_CONCURRENCY
        value: '1'
      - key: GUNICORN_CMD_ARGS
        value: '--preload'
      - key: SITE_URL
        fromService:
          name: little-rhymes
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_ORIGINS
        sync: false
