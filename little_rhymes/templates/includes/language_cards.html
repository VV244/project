<div class="language-grid">{% for language in nav_languages %}<a href="{{ language.get_absolute_url }}" class="language-card"><span class="language-letter tone-{{ forloop.counter0|divisibleby:2|yesno:'1,3' }}" lang="{{ language.code }}" dir="{{ language.text_direction }}">{{ language.native_name|slice:':1' }}</span><span><strong lang="{{ language.code }}" dir="{{ language.text_direction }}">{{ language.native_name }}</strong><small>{{ language.name }}</small></span><span class="language-arrow" aria-hidden="true"><i class="bi bi-arrow-up-right" aria-hidden="true"></i></span></a>{% endfor %}</div>
